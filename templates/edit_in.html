{% extends 'base.html' %}

{% block title %}入庫の編集{% endblock %}

{% block content %}

<h2>入庫の編集</h2>

<form method="post">
    {% if history_date %}
    <input type="hidden" name="history_date" value="{{ history_date }}">
    {% endif %}
    {% if history_product_name is defined %}
    <input type="hidden" name="history_product_name" value="{{ history_product_name }}">
    {% endif %}
    <table style="width: auto; text-align: center; margin: 1rem auto;">
        <thead>
            <tr>
                <th>玉数</th>
                <th>商品名</th>
                <th>入庫数</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>{{ item[2] }}</td>
                <td>{{ item[1] }}</td>
                <td>
                    <label for="received_quantity">入庫数</label><br>
                    <input type="number" step="1" min="0" id="received_quantity" name="received_quantity" value="{{ item[3] }}" required>
                </td>
            </tr>
        </tbody>
    </table>
    <p style="text-align:center;">
        <button type="submit">変更を保存</button>
    </p>
</form>

<p style="text-align:center;">
    {% if history_date %}
    <a href="{{ url_for('inventory_in_history', date=history_date, product_name=history_product_name) }}">履歴に戻る</a>
    {% else %}
    <a href="{{ url_for('inventory_in') }}">入庫に戻る</a>
    {% endif %}
</p>

{% endblock %}

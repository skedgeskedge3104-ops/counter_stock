{% extends 'base.html' %}

{% block title %}商品登録{% endblock %}

{% block content %}

<div class="menu-container" style="text-align: center;">
    <h2>商品登録</h2>
    <form method="post" onsubmit="alert('登録されました');">
        <label for="product_id">商品ID</label><br>
        <input type="text" id="product_id" name="product_id">
        <br>
        <label for="maker">メーカー</label><br>
        <input type="text" id="maker" name="maker">
        <br>
        <label for="category_name">カテゴリー名</label><br>
        <select name="category_name" id="category_name">
            <option value="disabled selected">カテゴリー選択</option>
            {% for c_name in category_names %}
                <option value="{{c_name}}">{{c_name}}</option>
            {% endfor %}
        </select>
        <br>
        <label for="shop_name">取引先企業名</label><br>
        <select name="shop_name" id="shop_name">
            <option value="disabled selected">企業名選択</option>
            {% for s_name in shop_names %}
                <option value="{{s_name}}">{{s_name}}</option>
            {% endfor %}
        </select>
        <br>
        <label for="group_name">玉数名</label><br>
        <select name="group_name" id="group_name" required>
            <option value="disabled selected">玉数選択</option>
            {% for name in group_names %}
                <option value="{{name}}">{{name}}</option>
            {% endfor %}
        </select>
        <br>
        <label for="product_name">商品名</label><br>
        <input type="text" id="product_name" name="product_name" required>
        <br>
        <label for="provisional_name">出庫時の通称</label><br>
        <select name="provisional_name" id="provisional_name">
            <option value="disabled selected">通称選択</option>
            {% for p_name in provisional_names %}
                <option value="{{p_name}}">{{p_name}}</option>
            {% endfor %}
        </select>
        <br>
        <label for="quantity_box">入り数</label><br>
        <input type="number" id="quantity_box" name="quantity_box" min="0" required>
        <br>
        <label for="unit_price">単価</label><br>
        <input type="number" step="0.01" min="0" id="unit_price" name="unit_price" required>
        <br>

      
        <button type="submit" class="btn-primary">登録</button>
    </form>
    <br><br>
    <a href="/">メニューに戻る</a>
</div>



{% endblock %}

{% extends 'base.html' %}

{% block title %}在庫一覧{% endblock %}

{% block content %}

<table>
    <thead>
        <tr>
            <th>入庫ID</th>
            <th>玉数</th>
            <th>商品名</th>
            <th>入庫数量</th>
            <th>入庫日</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item[0] }}</td>
            <td>{{ item[5] }}</td>
            <td>{{ item[6] }}</td>
            <td>{{ item[8] }}</td>
            <td>{{ item[10].strftime('%y,%m,%d') }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a style="display: block;" href="/">メニューに戻る</a>


  

{% endblock %}

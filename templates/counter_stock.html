{% extends 'base.html' %}

{% block title %}在庫一覧{% endblock %}

{% block content %}

<h2>在庫確認一覧</h2>

<div class="category-buttons">
    <button onclick="loadStock('お菓子')">お菓子</button>
    <button onclick="loadStock('ドリンク')">ドリンク</button>
    <button onclick="loadStock('たばこ')">たばこ</button>
</div>

<a href="group_by_counts_stock.html">玉数別在庫数はこちら</a>

<h3 id="currentCategoryTitle">表示中: お菓子</h3>

<table border="1">
    <thead>
        <tr>
            <th>玉数</th>
            <th>商品名</th>
            <th>在庫数</th>
        </tr>
    </thead>
    <tbody id="stockTableBody">
        </tbody>
</table>

<p><a href="/">メニューに戻る</a></p>



<script>
/**
 * 指定したカテゴリーの在庫を非同期で取得して表示
 */
function loadStock(category) {
    const tbody = document.getElementById('stockTableBody');
    const title = document.getElementById('currentCategoryTitle');
    
    // タイトルの更新
    title.textContent = `表示中: ${category}`;
    // 読み込み中の表示
    tbody.innerHTML = '<tr><td colspan="3">読み込み中...</td></tr>';

    // サーバーのAPIを叩く
    fetch(`/api/get_stock/${encodeURIComponent(category)}`)
        .then(res => {
            if (!res.ok) throw new Error('ネットワークエラー');
            return res.json();
        })
        .then(data => {
            tbody.innerHTML = ''; // クリア

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">在庫のある商品はありません</td></tr>';
                return;
            }

            // 取得したデータをループしてテーブルを作成
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.group}</td>
                    <td>${item.name}</td>
                    <td class="stock-val">${item.stock}</td>
                `;
                tbody.appendChild(row);
            });
        })
        .catch(err => {
            console.error(err);
            tbody.innerHTML = '<tr><td colspan="3" style="color:red;">データの取得に失敗しました</td></tr>';
        });
}

// ページを開いた時に初期表示として「お菓子」を読み込む
window.onload = () => loadStock('お菓子');
</script>

</body>


  

{% endblock %}

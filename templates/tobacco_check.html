{% extends 'base.html' %}

{% block title %}たばこ棚卸入力{% endblock %}

{% block content %}

<h2>たばこ棚卸入力</h2>

<table border="1" id="tobaccoTable">
    <tr>
        <th>銘柄</th>
        <th>DB在庫</th>
        <th>in_shelf (棚)</th>
        <th>unit_count (バラ)</th>
    </tr>

    {% for p in products %}
    <tr>
        <td>
            {{ p[0] }}
            <input type="hidden" class="product_name" value="{{ p[0] }}">
            <input type="hidden" class="group_name" value="{{ p[1] }}">
            <input type="hidden" class="db_stock" value="{{ p[2] }}">
        </td>
        <td>{{ p[2] }}</td>
        <td><input type="number" class="in_shelf" value="0" min="0"></td>
        <td><input type="number" class="unit_count" value="0" min="0"></td>
    </tr>
    {% endfor %}
</table>

<br>
<button type="button" id="confirmBtn">次へ（グループ別集計へ）</button>

<script>
document.getElementById("confirmBtn").addEventListener("click", () => {
    const rows = document.querySelectorAll("#tobaccoTable tr:not(:first-child)");
    const finalData = Array.from(rows).map(row => {
        return {
            product_name: row.querySelector(".product_name").value,
            group_name: row.querySelector(".group_name").value,
            db_stock: Number(row.querySelector(".db_stock").value),
            in_shelf_count: Number(row.querySelector(".in_shelf").value),
            unit_count: Number(row.querySelector(".unit_count").value)
        };
    });

    fetch("/tobacco_check/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(finalData)
    })
    .then(res => res.json())
    .then(data => {
        if(data.status === "ok") {
            window.location.href = "/tobacco_result";
        }
    })
    .catch(err => alert("送信エラーが発生しました"));
});
</script>
{% endblock %}

{% extends 'base.html' %}

{% block title %}分析{% endblock %}

{% block content %}
<table class="cost-percentage">
    <tr>
        <th>原価率</th>
    </tr>
    <tr>
        <td>{{cost_percentage}}</td>
    </tr>
</table>


<table class="cost-ratio-table">
    <tr>
        <th>商品名</th>
        <th>原価率</th>
    </tr>
    {% for cost in costs %}
    <tr>
        <th>{{cost[0]}}</th>
        <th>{{cost[1]}}</th>
    </tr>
    {% endfor %}
</table>


{% endblock %}

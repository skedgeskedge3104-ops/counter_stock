{% extends 'base.html' %}

{% block title %}{{ category_name }} — 棚卸入力{% endblock %}

{% block content %}

<h2>{{ category_name }} 棚卸入力</h2>

<p><a href="{{ url_for('inventory_check_menu') }}">カテゴリ選択に戻る</a></p>

<table border="1" id="inventoryTable">
    <tr>
        <th>銘柄</th>
        <th>DB在庫</th>
        <th>in_shelf (棚)</th>
        <th>unit_count (バラ)</th>
    </tr>

    {% for p in products %}
    <tr>
        <td>
            {{ p.product_name }}
            <input type="hidden" class="product_name" value="{{ p.product_name }}">
            <input type="hidden" class="group_name" value="{{ p.group_name }}">
            <input type="hidden" class="db_stock" value="{{ p.db_stock }}">
        </td>
        <td>{{ p.db_stock }}</td>
        <td><input type="number" class="in_shelf" value="{{ p.in_shelf_count }}"
           onfocus="if(this.value=='0')this.value='';"
           onblur="if(this.value=='')this.value='0';"></td>
        <td><input type="number" class="unit_count" value="{{ p.unit_count }}"
           onfocus="if(this.value=='0')this.value='';"
           onblur="if(this.value=='')this.value='0';"></td>
    </tr>
    {% endfor %}
</table>

<br>
<button type="button" id="confirmBtn">次へ（グループ別集計へ）</button>
<button type="button" id="draftBtn">仮保存</button>

<script>
const categoryName = {{ category_name | tojson }};
const draftSaveUrl = {{ url_for('inventory_check_draft_save') | tojson }};

function collectRows() {
    const rows = document.querySelectorAll("#inventoryTable tr:not(:first-child)");
    return Array.from(rows).map(row => {
        return {
            product_name: row.querySelector(".product_name").value,
            group_name: row.querySelector(".group_name").value,
            db_stock: Number(row.querySelector(".db_stock").value),
            in_shelf_count: Number(row.querySelector(".in_shelf").value),
            unit_count: Number(row.querySelector(".unit_count").value)
        };
    });
}

document.getElementById("confirmBtn").addEventListener("click", () => {
    const finalData = collectRows();

    fetch("{{ url_for('inventory_check_confirm') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category_name: categoryName, items: finalData })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "ok") {
            window.location.href = "{{ url_for('inventory_check_result') }}";
        }
    })
    .catch(() => alert("送信エラーが発生しました"));
});

document.getElementById("draftBtn").addEventListener("click", () => {
    const finalData = collectRows();
    fetch(draftSaveUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category_name: categoryName, items: finalData })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "ok") {
            alert("仮保存しました");
        } else {
            alert(data.message || "仮保存に失敗しました");
        }
    })
    .catch(() => alert("仮保存の送信エラーが発生しました"));
});
</script>
{% endblock %}

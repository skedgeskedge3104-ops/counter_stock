{% extends 'base.html' %}

{% block title %}棚卸結果{% endblock %}

{% block content %}

<h2>棚卸結果（GROUP別・本日）</h2>

<table border="1">
<tr>
    <th>GROUP</th>
    <th>実地在庫</th>
    <th>POS在庫</th>
    <th>差異</th>
</tr>

{% for r in results %}
<tr>
    <td>{{ r[0] }}</td>
    <td class="actual">{{ r[1] }}</td>
    <td>
        <input type="number" class="pos" oninput="calcDiff(this)">
    </td>
    <td class="diff">0</td>
</tr>
{% endfor %}
</table>
<a href="/">メニューに戻る</a>
<script>
function calcDiff(input) {
    const row = input.closest('tr');
    const actual = Number(row.querySelector('.actual').textContent);
    const pos = Number(input.value || 0);
    row.querySelector('.diff').textContent = actual - pos;
}
</script>



{% endblock %}

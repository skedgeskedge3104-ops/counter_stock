{% extends 'base.html' %}

{% block title %}棚卸結果{% endblock %}

{% block content %}
<style>
    .diff {
        font-weight: bold;
    }
    .plus {
        color: red;
    }
    .minus {
        color: blue;
    }
</style>
</head>
<body>

<h2>棚卸結果（GROUP別・本日）</h2>

<table border="1" cellpadding="6">
    <tr>
        <th>GROUP</th>
        <th>DB在庫</th>
        <th>実地在庫</th>
        <th>POS在庫</th>
        <th>差異</th>
    </tr>

    {% for r in results %}
    <tr>
        <td>{{ r[0] }}</td>
        <td>{{ r[1] }}</td>
        <td>{{ r[2] }}</td>
        <td>{{ r[3] }}</td>
        <td class="diff {% if r[4] > 0 %}plus{% elif r[4] < 0 %}minus{% endif %}">
            {{ r[4] }}
        </td>
    </tr>
    {% endfor %}
</table>

<br>
<a href="{{ url_for('tobacco_check') }}">← 入力に戻る</a>

</body>
</html>


{% endblock %}

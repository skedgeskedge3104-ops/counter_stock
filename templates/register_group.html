{% extends 'base.html' %}

{% block title %}玉数登録{% endblock %}

{% block content %}

<body style="display: flex;">
    


    <div class="menu-container" style="text-align: center;">
        <h2>玉数登録</h2>
        <form method="post" onsubmit="alert('登録されました');">
            <label for="group_name">玉数名</label><br>
            <input type="text" id="group_name" name="group_name" required>
            <br><br><br>
            <label for="values">実質玉数（金額）</label>
            <input type="number" id="values" step="0.01" name="values" min="0">
            <br><br><br>

            <button type="submit">登録</button>
        </form>
        <br><br><br>
        <a href="/">メニューに戻る</a>
    </div>

    <table style="width: auto;  text-align: center; margin: 50px auto;" >
        <thead>
            <tr>
                <th>玉数名</th>
                <th>金額</th>
            </tr>
        </thead>
        <tbody>
            {% for item in group_by_counts %}
            <tr>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>

{% endblock %}

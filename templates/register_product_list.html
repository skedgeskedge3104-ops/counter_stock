{% extends 'base.html' %}

{% block title %}登録商品一覧{% endblock %}

{% block content %}

<div style="width: 96%; margin: 0 auto; text-align: center;">
    <h2>登録商品一覧</h2>
    <form method="get" style="margin-bottom: 1em;">
        <label for="category_name">カテゴリー選択</label><br>
        <select name="category_name" id="category_name" onchange="this.form.submit()">
            {% for c_name in categories %}
            <option value="{{ c_name }}" {% if c_name == selected_category %}selected{% endif %}>{{ c_name }}</option>
            {% endfor %}
        </select>
        <input type="hidden" name="tab" value="{{ selected_tab or 'active' }}">
    </form>

    <div style="display:flex; justify-content:center; gap: 0.5rem; margin: 0.75rem 0 1rem;">
        <a href="{{ url_for('register_product_list', category_name=selected_category, tab='active') }}"
           class="btn-compact-action" {% if selected_tab == 'active' %}style="font-weight:700;"{% endif %}>有効中</a>
        <a href="{{ url_for('register_product_list', category_name=selected_category, tab='future') }}"
           class="btn-compact-action" {% if selected_tab == 'future' %}style="font-weight:700;"{% endif %}>開始前</a>
        <a href="{{ url_for('register_product_list', category_name=selected_category, tab='expired') }}"
           class="btn-compact-action" {% if selected_tab == 'expired' %}style="font-weight:700;"{% endif %}>終了済み</a>
        <a href="{{ url_for('register_product_list', category_name=selected_category, tab='all') }}"
           class="btn-compact-action" {% if selected_tab == 'all' %}style="font-weight:700;"{% endif %}>すべて</a>
    </div>

    <table border="1" style="width: 100%; border-collapse: collapse; table-layout: fixed;">
        <thead>
            <tr>
                <th>商品名</th>
                <th>玉数</th>
                <th>pos_code</th>
                <th>開始日</th>
                <th>終了日</th>
                <th>更新</th>
            </tr>
        </thead>
        <tbody>
            {% for p in products %}
            <tr>
                <td>{{ p[0] }}</td>
                <td>{{ p[1] }}</td>
                <td>
                    <input type="number" name="pos_code" form="row-form-{{ loop.index0 }}"
                        value="{{ p[2] if p[2] is not none else '' }}">
                </td>
                <td>
                    <input type="date" name="effective_from" form="row-form-{{ loop.index0 }}"
                        value="{{ p[3] }}">
                </td>
                <td>
                    <input type="date" name="effective_to" form="row-form-{{ loop.index0 }}"
                        value="{{ p[4] if p[4] is not none else '' }}">
                </td>
                <td>
                    <form id="row-form-{{ loop.index0 }}" method="post">
                        <input type="hidden" name="category_name" value="{{ selected_category }}">
                        <input type="hidden" name="tab" value="{{ selected_tab or 'active' }}">
                        <input type="hidden" name="product_name" value="{{ p[0] }}">
                        <button type="submit">保存</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="6">該当カテゴリの商品がありません</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <a href="{{ url_for('register') }}">登録メニューに戻る</a>
</div>

{% endblock %}

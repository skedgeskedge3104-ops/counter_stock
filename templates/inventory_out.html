{% extends 'base.html' %}

{% block title %}出庫{% endblock %}

{% block content %}
<body style="display: flex;">
    <div class="menu-container" style="text-align: center;">
        <h2>出庫</h2>
        <br>
        <form method="post" onsubmit="alert('登録されました')">
            <label for="group_name">玉数</label><br>
            <select name="group_name" id="group_name" onchange="getProductData()">
                <option value="" disabled selected>玉数選択</option>
                {% for g_name in group_names %}
                    <option value="{{g_name}}">{{g_name}}</option>
                {% endfor %}
            </select>

            <br><br>

<label for="product_name">商品名</label><br>
<select name="product_name" id="product_name">
    <option value="" disabled selected>先に玉数を選択してください</option>
    </select>
            <br><br>
            <label for="shipped_quantity">出庫数</label><br>
            <input type="number" step="1" min="0" id="shipped_quantity" name="shipped_quantity"><br><br>
            <button type="submit">登録</button>
        </form>
        <a href="/">メニューに戻る</a><br>
      
    </div>

    <table style="width: auto;  text-align: center; margin: 50px auto;" >
        <thead>
            <tr>
                <th>玉数名</th>
                <th>商品名</th>
                <th>出庫数</th>
                <th>出庫日</th>
                <th>編集</th>
            </tr>
        </thead>
        <tbody>
            {% for item in inventory_out %}
            <tr>
                <td>{{ item[2] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[3] }}</td>
                <td>{{ item[4].strftime('%y,%m,%d')  }}</td>

                <td>
                    <form action="{{url_for('edit_out',out_id=item[0])}}" style="display: block;">
                        <input type="submit" value="編集">
                    </form>
                    <form action="{{url_for('delete_out',out_id=item[0])}}" onsubmit="return confirm('本当に削除しますか？')" method="post" style="display: block;">
                        <input type="submit" value="削除">
                    </form>
                </td>
            </tr>
            {% endfor %}

        </tbody>
    </table>
</body>


<script>
async function getProductData() {
    const groupSelect = document.getElementById('group_name');
    const productSelect = document.getElementById('product_name');
    
    // 選択された「玉数」の値を取得
    const selectedGroup = groupSelect.value;
    
    if (!selectedGroup) return;

    try {
        // ステップ2で作ったAPIにリクエストを投げる（非同期通信）
        const response = await fetch(`/get_product_names/${selectedGroup}`);
        const data = await response.json(); // JSONとして解析

        // 「商品名」のドロップダウンを一旦クリア
        productSelect.innerHTML = '<option value="" disabled selected>商品名を選択</option>';

        // 取得したデータを一つずつoptionタグにして追加
        data.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            productSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Fetch error:', error);
    }
}
</script>
{% endblock %}

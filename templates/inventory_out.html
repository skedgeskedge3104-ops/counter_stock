{% extends 'base.html' %}

{% block title %}出庫{% endblock %}

{% block content %}
<body style="display: block;">
    <div class="menu-container" style="text-align: center;">
        <h2>出庫</h2>
        <br>
        <form method="post" onsubmit="alert('登録されました')">
            <label for="category_name">カテゴリ</label><br>
            <select id="category_name" onchange="onCategoryChange()">
                <option value="" disabled selected>カテゴリ選択</option>
                {% for c in category_names %}
                    <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>
            <br><br>
            <label for="group_name">玉数</label><br>
            <select name="group_name" id="group_name" onchange="onGroupChange()">
                <option value="" disabled selected>先にカテゴリを選択</option>
            </select>
            <br><br>
            <label for="product_name">商品名</label><br>
            <select name="product_name" id="product_name">
                <option value="" disabled selected>先に玉数を選択してください</option>
            </select>
            <br><br>
            <label for="shipped_quantity">出庫数</label><br>
            <input type="number" step="1" min="0" id="shipped_quantity" name="shipped_quantity"><br><br>
            <button type="submit">登録</button>
        </form>
        <a href="{{ url_for('inventory_out_history') }}">出庫履歴（日付指定）</a><br>
        <a href="/">メニューに戻る</a><br>
      
    </div>

    <table style="width: 90%;  text-align: center; margin: 50px auto;" >
        <thead>
            <tr>
                <th>玉数名</th>
                <th>商品名</th>
                <th>出庫数</th>
                <th>出庫日</th>
                <th>編集</th>
            </tr>
        </thead>
        <tbody>
            {% for item in inventory_out %}
            <tr>
                <td>{{ item[2] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[3] }}</td>
                <td>{{ item[4]|ts_display }}</td>

                <td>
                    <form action="{{url_for('edit_out',out_id=item[0])}}" method="get" style="display: block;">
                        <button type="submit" class="btn-compact-action">編集</button>
                    </form>
                    <form action="{{url_for('delete_out',out_id=item[0])}}" onsubmit="return confirm('本当に削除しますか？')" method="post" style="display: block;">
                        <button type="submit" class="btn-compact-action">削除</button>
                    </form>
                </td>
            </tr>
            {% endfor %}

        </tbody>
    </table>
</body>


<script>
async function onCategoryChange() {
    const cat = document.getElementById('category_name').value;
    const groupSelect = document.getElementById('group_name');
    const productSelect = document.getElementById('product_name');
    productSelect.innerHTML = '<option value="" disabled selected>先に玉数を選択してください</option>';
    if (!cat) {
        groupSelect.innerHTML = '<option value="" disabled selected>先にカテゴリを選択</option>';
        return;
    }
    try {
        const res = await fetch('/api/group_names_by_category/' + encodeURIComponent(cat));
        const groups = await res.json();
        groupSelect.innerHTML = '<option value="" disabled selected>玉数選択</option>';
        groups.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            groupSelect.appendChild(opt);
        });
    } catch (e) {
        console.error(e);
    }
}

async function onGroupChange() {
    const cat = document.getElementById('category_name').value;
    const groupSelect = document.getElementById('group_name');
    const productSelect = document.getElementById('product_name');
    const selectedGroup = groupSelect.value;
    productSelect.innerHTML = '<option value="" disabled selected>商品名を選択</option>';
    if (!cat || !selectedGroup) return;
    try {
        const q = new URLSearchParams({ category: cat, group_name: selectedGroup });
        const res = await fetch('/get_product_names_for?' + q.toString());
        const data = await res.json();
        data.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            productSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Fetch error:', error);
    }
}
</script>
{% endblock %}

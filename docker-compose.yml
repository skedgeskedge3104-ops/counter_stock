services:
  db:
    image: postgres:15-alpine
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 15s
      timeout: 15s
      retries: 15

    volumes:
      - postgres_data_v2:/var/lib/postgresql/data

  web:
    build: .
    restart: always

    volumes:
      - .:/app

    ports:
      - "8082:8081"

    environment:
      DATABASE_URL: ${DATABASE_URL}

    command:
      [
        "./wait-for-it.sh",
        "db:5432",
        "--",
        "gunicorn",
        "counter:app",
        "-b",
        "0.0.0.0:8081",
        "--reload"
      ]

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_v2:

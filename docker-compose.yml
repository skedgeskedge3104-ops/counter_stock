# docker-compose.yml

version: '3.8'


services:
  # データベースサービス (PostgreSQL)
  db:
    # ... dbの設定 ...
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d counter_db"]
      interval: 15s
      timeout: 15s
      retries: 15
    image: postgres:15-alpine # 軽量なPostgreSQLイメージを使用
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: futaba0127
      POSTGRES_DB: counter_db
    # データ永続化のため、ボリュームを使用（コンテナを削除してもデータが残る）
    volumes:
      - postgres_data:/var/lib/postgresql/data


  # アプリケーションサービス (Flask + Gunicorn)
  web:
    build: . # カレントディレクトリのDockerfileを使用
    restart: always
    ports:
      - "8081:8080" # ホストの8080ポートをコンテナの8080ポートにマッピング
    environment:
      # アプリケーションがデータベースに接続するための情報
      DATABASE_URL: postgresql://user:futaba0127@db:5432/counter_db

    command: ["./wait-for-it.sh", "db:5432", "--", "gunicorn", "counter:app", "-b", "0.0.0.0:8080"] 
    # dbサービスが起動してからwebサービスを起動
    depends_on:
      db:
        condition: service_healthy # dbサービスがhealthcheckをパスするまで待つ
    # Gunicornを使ってapp.py内のappインスタンスを起動
    # command: gunicorn --bind 0.0.0.0:8080 app:app


volumes:
  postgres_data: